<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="1200" height="660" rx="16" fill="#0d1117"/>
  <text x="60" y="64" fill="#e6edf3" font-size="26" font-weight="600">界面一览</text>
  <text x="60" y="94" fill="#8b949e" font-size="16">入口就在回复旁边，不打断阅读</text>

  <!-- chat panel -->
  <g transform="translate(60,120)">
    <rect width="500" height="440" rx="12" fill="#161b22" stroke="#2d333b"/>
    <!-- user bubble -->
    <rect x="210" y="28" width="262" height="46" rx="10" fill="#1f2a3d"/>
    <text x="232" y="57" fill="#e6edf3" font-size="15">帮我整理这份数据</text>
    <!-- tool record -->
    <g transform="translate(28,96)">
      <rect width="300" height="36" rx="8" fill="#1c2129"/>
      <text x="16" y="24" fill="#8b949e" font-size="14">⚙ 读取 data.csv</text>
      <text x="262" y="24" fill="#3fb950" font-size="14">✓</text>
    </g>
    <!-- assistant bubble -->
    <rect x="28" y="152" width="420" height="96" rx="10" fill="#1c2129"/>
    <text x="48" y="184" fill="#e6edf3" font-size="15">整理完成。结论如下：</text>
    <text x="48" y="212" fill="#8b949e" font-size="14">销售额环比上升 12%，其中华东</text>
    <text x="48" y="234" fill="#8b949e" font-size="14">区贡献最大……</text>
    <!-- icon action row -->
    <g transform="translate(28,262)">
      <g stroke="#8b949e" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="6" width="12" height="14" rx="2"/>
        <path d="M10 6V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/>
      </g>
      <g transform="translate(40,0)">
        <rect x="-2" y="-2" width="28" height="28" rx="6" fill="#4d8dff" fill-opacity="0.14"/>
        <g stroke="#4d8dff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 19h14"/>
          <path d="M15.5 3.5a2.1 2.1 0 0 1 3 3L7 18l-4 1 1-4z"/>
        </g>
      </g>
      <g transform="translate(80,0)" stroke="#8b949e" stroke-width="1.8" fill="none" stroke-linecap="round">
        <circle cx="7" cy="6" r="3"/>
        <circle cx="7" cy="18" r="3"/>
        <circle cx="19" cy="12" r="3"/>
        <path d="M10 6h4a2 2 0 0 1 2 2v1M10 18h4a2 2 0 0 0 2-2v-1"/>
      </g>
    </g>
    <!-- turn tail: ring + edit prompt + retry -->
    <g transform="translate(28,330)">
      <rect width="444" height="1" fill="#2d333b"/>
      <g transform="translate(0,20)">
        <rect width="96" height="32" rx="16" fill="#1c2129" stroke="#2d333b"/>
        <text x="14" y="22" fill="#8b949e" font-size="16">‹</text>
        <text x="36" y="21" fill="#e6edf3" font-size="14">2 / 3</text>
        <text x="74" y="22" fill="#8b949e" font-size="16">›</text>
        <g transform="translate(112,4)" stroke="#8b949e" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 19h14"/>
          <path d="M15.5 3.5a2.1 2.1 0 0 1 3 3L7 18l-4 1 1-4z"/>
        </g>
        <g transform="translate(150,4)" stroke="#8b949e" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 4v6h-6"/>
          <path d="M20.5 15a9 9 0 1 1-2.1-9.4L21 8"/>
        </g>
      </g>
    </g>
    <text x="28" y="416" fill="#8b949e" font-size="13">同一对话在侧栏只占一条</text>
  </g>

  <!-- callouts left -->
  <g stroke="#4d8dff" stroke-width="1.2" stroke-dasharray="3 4" fill="none">
    <path d="M128 388v34h-24"/>
    <path d="M150 470v26h-46"/>
  </g>
  <text x="60" y="446" fill="#4d8dff" font-size="14">编辑回复（图标 + 悬停提示）</text>
  <text x="60" y="520" fill="#4d8dff" font-size="14">‹n/m› 版本环 · 编辑提问 · 重新生成</text>

  <!-- dialog panel -->
  <g transform="translate(640,120)">
    <rect width="500" height="440" rx="12" fill="#161b22" stroke="#2d333b"/>
    <text x="32" y="52" fill="#e6edf3" font-size="20" font-weight="600">编辑回复</text>
    <text x="32" y="82" fill="#8b949e" font-size="14">保存后从你的版本继续，原对话保留。</text>
    <rect x="32" y="104" width="436" height="230" rx="8" fill="#1c2129" stroke="#2d333b"/>
    <text x="52" y="140" fill="#e6edf3" font-size="15">整理完成。结论如下：</text>
    <text x="52" y="170" fill="#e6edf3" font-size="15">销售额环比上升 12%，华东区贡献</text>
    <text x="52" y="198" fill="#e6edf3" font-size="15">最大。建议下季度继续加码。</text>
    <rect x="356" y="186" width="2" height="18" fill="#4d8dff"/>
    <text x="52" y="308" fill="#8b949e" font-size="13">正文 / 思考文本 可切换</text>
    <!-- footer -->
    <g transform="translate(0,360)">
      <rect x="270" y="0" width="88" height="38" rx="19" fill="none" stroke="#2d333b"/>
      <text x="296" y="25" fill="#8b949e" font-size="14">取消</text>
      <rect x="370" y="0" width="100" height="38" rx="19" fill="#4d8dff"/>
      <text x="384" y="25" fill="#ffffff" font-size="14">保存并继续</text>
    </g>
  </g>
  <g stroke="#4d8dff" stroke-width="1.2" stroke-dasharray="3 4" fill="none">
    <path d="M1040 500v22"/>
  </g>
  <text x="946" y="546" fill="#4d8dff" font-size="14">Ctrl / Cmd + Enter 直接保存</text>

  <text x="60" y="612" fill="#8b949e" font-size="14">深色 / 浅色主题自动跟随宿主 · 8 种界面语言</text>
</svg>